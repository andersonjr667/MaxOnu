<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste - Sistema de Notificações MaxOnu</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/notification-cards.css">
    <script src="/js/notification-system.js"></script>
    <style>
        body {
            padding: 40px;
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1a1a1a;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 40px;
        }
        .test-section {
            margin-bottom: 30px;
        }
        .test-section h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }
        .test-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .test-btn:hover {
            transform: translateY(-2px);
        }
        .btn-success {
            background: #4caf50;
            color: white;
        }
        .btn-error {
            background: #f44336;
            color: white;
        }
        .btn-warning {
            background: #ff9800;
            color: white;
        }
        .btn-info {
            background: #2196F3;
            color: white;
        }
        .btn-confirm {
            background: #9c27b0;
            color: white;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #f0f0f0;
            display: none;
        }
        .result.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🧪 Teste do Sistema de Notificações</h1>
        <p class="subtitle">Teste todos os tipos de cards de notificação com a logo da MaxOnu</p>

        <div class="test-section">
            <h2>Alerts Simples</h2>
            <div class="button-grid">
                <button class="test-btn btn-success" onclick="testSuccess()">✓ Sucesso</button>
                <button class="test-btn btn-error" onclick="testError()">✕ Erro</button>
                <button class="test-btn btn-warning" onclick="testWarning()">⚠ Aviso</button>
                <button class="test-btn btn-info" onclick="testInfo()">ℹ Info</button>
            </div>
        </div>

        <div class="test-section">
            <h2>Confirmações</h2>
            <div class="button-grid">
                <button class="test-btn btn-confirm" onclick="testConfirm()">? Confirmar Ação</button>
                <button class="test-btn btn-confirm" onclick="testConfirmDelete()">🗑️ Confirmar Exclusão</button>
            </div>
            <div id="confirmResult" class="result"></div>
        </div>

        <div class="test-section">
            <h2>Alert Nativo (substituído automaticamente)</h2>
            <div class="button-grid">
                <button class="test-btn btn-info" onclick="alert('Este é um alert() nativo que foi substituído!')">Alert Nativo</button>
                <button class="test-btn btn-confirm" onclick="testNativeConfirm()">Confirm Nativo</button>
            </div>
        </div>

        <div class="test-section">
            <h2>Mensagens Longas</h2>
            <div class="button-grid">
                <button class="test-btn btn-info" onclick="testLongMessage()">Mensagem Longa</button>
            </div>
        </div>
    </div>

    <script>
        function testSuccess() {
            MaxOnuNotify.success('Operação realizada com sucesso! Seus dados foram salvos.', 'Sucesso');
        }

        function testError() {
            MaxOnuNotify.error('Ocorreu um erro ao processar sua solicitação. Tente novamente.', 'Erro');
        }

        function testWarning() {
            MaxOnuNotify.warning('Atenção: Verifique os dados antes de continuar.', 'Aviso');
        }

        function testInfo() {
            MaxOnuNotify.alert('Esta é uma mensagem informativa para você.', 'Informação');
        }

        async function testConfirm() {
            const result = await MaxOnuNotify.confirm('Tem certeza que deseja continuar com esta ação?', 'Confirmar');
            const resultDiv = document.getElementById('confirmResult');
            resultDiv.textContent = result ? '✓ Usuário confirmou' : '✕ Usuário cancelou';
            resultDiv.className = 'result show';
            setTimeout(() => resultDiv.classList.remove('show'), 3000);
        }

        async function testConfirmDelete() {
            const result = await MaxOnuNotify.confirm('Esta ação não pode ser desfeita. Deseja realmente excluir?', 'Confirmar Exclusão');
            const resultDiv = document.getElementById('confirmResult');
            resultDiv.textContent = result ? '🗑️ Item excluído' : '✕ Exclusão cancelada';
            resultDiv.className = 'result show';
            setTimeout(() => resultDiv.classList.remove('show'), 3000);
        }

        async function testNativeConfirm() {
            const result = await confirm('Este é um confirm() nativo que foi substituído!');
            const resultDiv = document.getElementById('confirmResult');
            resultDiv.textContent = result ? '✓ Confirmado via confirm nativo' : '✕ Cancelado via confirm nativo';
            resultDiv.className = 'result show';
            setTimeout(() => resultDiv.classList.remove('show'), 3000);
        }

        function testLongMessage() {
            MaxOnuNotify.alert(
                'Esta é uma mensagem mais longa para testar como o card se comporta com textos maiores. O sistema deve ajustar automaticamente o tamanho e manter a legibilidade em todos os dispositivos, incluindo mobile.',
                'Mensagem Longa'
            );
        }
    </script>
</body>
</html>
