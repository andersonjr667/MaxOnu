<!-- Header Component -->
<link rel="stylesheet" href="/css/layout/header.css" />


<header class="mx-header" data-mx-header>
  <div class="mx-header__inner">
    <a class="mx-header__brand" href="/" aria-label="MaxOnu 2026 - Início">
      <img class="mx-header__brand-logo" src="/images/logo-maxonu.png" alt="" aria-hidden="true" />
      <span class="mx-header__brand-copy">
        <small class="mx-header__brand-kicker">Colégio Maximus</small>
        <strong class="mx-header__brand-title">MaxOnu 2026</strong>
      </span>
    </a>

    <nav class="mx-header__nav" aria-label="Navegação principal" data-mx-nav>
      <ul class="mx-header__nav-list" data-mx-nav-list>
        <li><a class="mx-header__nav-link" href="/blog">Blog</a></li>
        <li><a class="mx-header__nav-link" href="/guias">Guias</a></li>
        <li><a class="mx-header__nav-link" href="/delegacoes">Delegações</a></li>
        <li><a class="mx-header__nav-link" href="/dpos">DPOs</a></li>
        <li><a class="mx-header__nav-link" href="/regras">Regras</a></li>
        <li><a class="mx-header__nav-link" href="/faq">FAQ</a></li>
        <li class="mx-header__nav-item mx-header__nav-item--newsletter" hidden>
          <a class="mx-header__nav-link" href="/newsletter">Newsletter</a>
        </li>
        <li class="mx-header__nav-item mx-header__nav-item--admin" hidden>
          <a class="mx-header__nav-link" href="/analytics">Analytics</a>
        </li>
      </ul>
    </nav>

    <div class="mx-header__actions">
      <div class="mx-header__notif" data-mx-notif-root>
        <button
          class="mx-header__notif-toggle"
          type="button"
          data-mx-notif-toggle
          aria-expanded="false"
          aria-controls="mxHeaderNotifPanel"
          aria-label="Notificações"
        >
          <span class="mx-header__notif-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path d="M13.73 21a2 2 0 0 1-3.46 0" />
            </svg>
          </span>
          <span class="mx-header__notif-badge" data-mx-notif-badge hidden aria-hidden="true">0</span>
        </button>
        <div class="mx-header__notif-overlay" data-mx-notif-overlay aria-hidden="true" hidden></div>
        <div
          class="mx-header__notif-panel"
          id="mxHeaderNotifPanel"
          data-mx-notif-panel
          role="region"
          aria-label="Lista de notificações"
          hidden
        >
          <div class="mx-header__notif-head">
            <h2 class="mx-header__notif-title">Notificações</h2>
            <div class="mx-header__notif-tools">
              <button type="button" class="mx-header__notif-tool" data-mx-notif-markall title="Marcar todas como lidas" aria-label="Marcar todas como lidas">✓</button>
              <button type="button" class="mx-header__notif-tool" data-mx-notif-close title="Fechar" aria-label="Fechar painel">×</button>
            </div>
          </div>
          <div class="mx-header__notif-body" data-mx-notif-list></div>
        </div>
      </div>
      <button class="mx-header__theme-btn" id="themeToggle" type="button" aria-label="Alternar tema claro e escuro">
        <span class="mx-header__theme-visual" aria-hidden="true">
          <svg class="mx-header__theme-icon mx-header__theme-icon--moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="mx-header__theme-icon mx-header__theme-icon--sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
        </span>
      </button>
      <div class="mx-header__auth" data-mx-auth></div>
      <button
        class="mx-header__menu-btn"
        type="button"
        data-mx-menu-toggle
        aria-controls="navLinks"
        aria-expanded="false"
        aria-label="Abrir menu"
      >
        <span class="mx-header__menu-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <div class="mx-header__menu-backdrop" data-mx-menu-backdrop aria-hidden="true" hidden></div>
  <nav class="mx-header__mobile-shell" aria-label="Menu móvel">
    <ul id="navLinks" class="mx-header__mobile-list"></ul>
  </nav>
</header>
<script src="/js/header.js" defer></script>
