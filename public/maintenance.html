<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manutenção | MaxOnu 2026</title>
  <meta name="description" content="O site está em manutenção. Volte em breve.">
  <link rel="stylesheet" href="/css/styles.css">

</head>
<body>
  <main class="main-content error-page">
    <section class="content-section error-page__section">
      <div class="container-404 error-page__shell">

          <div class="error-page__brand">
            <span class="error-page__badge">🔧</span>
            <img src="/images/logo-maxonu.png" alt="Logo MaxOnu" class="error-logo">

          <div class="error-page__copy">
            <p class="dashboard-kicker">Manutenção</p>
            <h1>Site em manutenção</h1>
            <p class="error-page__lead">
              Estamos realizando melhorias no site. Por favor, volte em breve.
            </p>
          </div>
        </div>

        <div class="button-group error-page__actions">
          <a class="btn btn-primary" href="/login">Área administrativa</a>
        </div>
      </div>
    </section>
  </main>

</html>
